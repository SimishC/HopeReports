<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>HOPE · 综合日报</title>
<style>
:root{--ink:#17243b;--muted:#718096;--line:#e2e8f0;--blue:#2563eb;--teal:#0f766e;--paper:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1180px;margin:auto;padding:32px 24px 60px}
.hero{background:linear-gradient(130deg,#173b66,#176b73);color:#fff;padding:28px 32px;border-radius:16px;box-shadow:0 12px 30px #163b6622}
.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.78}
h1{font-size:30px;margin:7px 0 8px}.hero p{margin:0;color:#e1eff5}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px}
.pill{padding:5px 10px;border:1px solid #ffffff55;border-radius:99px;background:#ffffff12}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 12px #0f172a08}
.card{padding:17px 19px}.card label{display:block;color:var(--muted);font-size:12px}.card strong{display:block;margin-top:7px;font-size:22px}
.panel{padding:22px 24px}h2{font-size:18px;margin:0 0 16px;padding-left:11px;border-left:4px solid #19a39b}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:20px;background:#fff;padding:7px 12px;color:#455468;cursor:pointer}
.filter b{margin-left:4px;color:var(--blue)}.filter.active{background:#eaf2ff;border-color:#b8d0ff;color:#1849a9}
input{width:min(300px,100%);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;outline-color:#86aefc}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf1f5;font-size:14px}th{font-size:12px;color:var(--muted);font-weight:600;background:#f8fafc}td small{display:block;color:var(--muted);margin-top:4px}.date{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;background:#e8f5f3;color:#0f766e;border-radius:20px;padding:4px 9px;font-size:12px}
.open{display:inline-block;text-decoration:none;background:#edf4ff;color:#1d4ed8;border-radius:8px;padding:8px 12px;font-weight:600;white-space:nowrap}.open:hover{background:#dbeafe}
.empty{display:none;text-align:center;color:var(--muted);padding:30px}
.note{font-size:12px;color:var(--muted);margin:14px 2px 0;line-height:1.7}
@media(max-width:720px){main{padding:18px 12px 36px}.hero{padding:23px 20px}h1{font-size:25px}.cards{grid-template-columns:1fr}.panel{padding:18px 14px}}
</style>
</head>
<body>
<main>
<header class="hero">
  <div class="eyebrow">HOPE · OPERATIONS INTELLIGENCE</div>
  <h1>综合日报</h1>
  <p>经营表现、投放回收、稳定性、经济生态与 GS 运营汇总</p>
  <div class="meta"><span class="pill">最新数据日：2026-11-03</span><span class="pill">定期报告</span><span class="pill">网页阅读版</span></div>
</header>
<section class="cards" aria-label="报告概览">
  <div class="card"><label>日报数量</label><strong>2</strong></div>
  <div class="card"><label>最新数据日期</label><strong>2026-11-03</strong></div>
  <div class="card"><label>报告内容</label><strong>6 个专题</strong></div>
</section>
<section class="panel">
  <h2>01 报告与筛选</h2>
  <div class="toolbar"><div class="filters"><button class="filter active" data-filter="all">全部 <b>2</b></button><button class="filter" data-filter="2026-11">2026-11 <b>1</b></button><button class="filter" data-filter="2026-10">2026-10 <b>1</b></button></div><input id="search" type="search" placeholder="搜索日期或报告"></div>
  <div class="tablewrap"><table><thead><tr><th>数据日期</th><th>报告</th><th>格式</th><th>阅读</th></tr></thead><tbody id="rows"><tr data-date="2026-11"><td class="date">2026-11-03</td><td><strong>HOPE 综合日报</strong><small>经营 · 投放 · 稳定性 · 经济与 GS</small></td><td><span class="tag">HTML 页面</span></td><td><a class="open" href="HOPE_综合日报_20261103.html">打开日报 ↗</a></td></tr>
<tr data-date="2026-10"><td class="date">2026-10-21</td><td><strong>HOPE 综合日报</strong><small>经营 · 投放 · 稳定性 · 经济与 GS</small></td><td><span class="tag">HTML 页面</span></td><td><a class="open" href="HOPE_综合日报_20261021.html">打开日报 ↗</a></td></tr></tbody></table></div>
  <div id="empty" class="empty">没有匹配的日报</div>
  <p class="note">打开后可在浏览器中阅读完整日报。页面按数据日期排列；报告内保留各指标来源和统计口径。</p>
</section>
</main>
<script>
const buttons=[...document.querySelectorAll('.filter')], rows=[...document.querySelectorAll('#rows tr')], search=document.querySelector('#search');
let selected='all';
function apply(){const q=search.value.trim().toLowerCase();let shown=0;for(const row of rows){const matchMonth=selected==='all'||row.dataset.date===selected;const matchText=!q||row.innerText.toLowerCase().includes(q);row.hidden=!(matchMonth&&matchText);if(!row.hidden)shown++;}document.querySelector('#empty').style.display=shown?'none':'block';}
buttons.forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.filter;buttons.forEach(item=>item.classList.toggle('active',item===button));apply();}));
search.addEventListener('input',apply);
</script>
</body></html>
